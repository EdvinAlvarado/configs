[mgr]
linemode = "size"

[preview]
image_preview = "kitty"

[opener]
music = [{ run = 'elisa %s', orphan = true, for = "unix" }]
image = [{ run = 'feh %s', orphan = true, for = "unix" }]
3dprint = [{ run = 'bambu-studio %s', orphan = true, for = "unix" }]
video = [
	{ run = 'mpv %s', orphan = true, for = "unix" },
	{ run = 'vlc %s', orphan = true, for = "unix" },
	{ run = 'ghb %s', orphan = true, for = "unix", desc = "Handbrake" },
]
mkv = [
	{ run = 'mkvtoolnix-gui %s', orphan = true, for = "unix", desc = "MKVToolNix" },
]
docs = [{ run = 'okular %s', orphan = true, for = "unix" }]
nvim = [{ run = 'nvim %s', block = true, for = "unix" }]
archive = [{ run = 'ark %s', orphan = true, for = "unix" }]


[open]
prepend_rules = [
	{ mime = "audio/*", use = ["music", "reveal"] },
	{ mime = "image/*", use = ["image", "reveal"] },
	{ url = "*.3mf", use = "3dprint" },
	{ url = "*.cbz", use = ["docs", "reveal"] },
	{ url = "*.cbr", use = ["docs", "reveal"] },
	{ mime = "video/matroska", use = ["play", "reveal", "video", "mkv"] },
	{ mime = "video/*", use = ["play", "reveal", "video"] },
]


[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git" 

# piper
[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'

[[plugin.prepend_previewers]]
mime = "application/sqlite3"
run  = 'piper -- sqlite3 "$1" ".schema --indent"'

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- bat -p --color=always "$1"'
